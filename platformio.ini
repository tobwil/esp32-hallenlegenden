; Hallen-Legenden Mini – Firmware für Waveshare ESP32-S3-Touch-AMOLED-1.8 (V2)
; Der Simulator für den Mac baut über sim/Makefile, nicht über PlatformIO.

[platformio]
src_dir = firmware
default_envs = amoled18

[env:amoled18]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17
    -I game
    -DESP32QSPI_MAX_PIXELS_AT_ONCE=4096
build_unflags = -std=gnu++11
build_src_filter = +<*> +<../game/*.cpp>
lib_deps =
    moononournation/GFX Library for Arduino@1.6.8
monitor_speed = 115200
upload_speed = 921600
